<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตรวจบิล</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <div class="shell">
    <nav class="rail" aria-label="เมนูหลัก">
      <div class="logo"><span><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2a2133" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="m9 15 2 2 4-4"/></svg></span></div>
      <button class="nav" data-view="overview" type="button"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>ภาพรวม</button>
      <button class="nav" data-view="bills" type="button"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>บิลทั้งหมด</button>
      <button class="nav" data-view="billing" type="button"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/><path d="M8 15h4"/></svg>ใบวางบิล</button>
      <button class="nav" data-view="problems" type="button"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>ต้องตรวจ<span class="badge" id="navBadge" hidden></span></button>
      <button class="nav" data-view="customers" type="button"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>ลูกค้า</button>
      <div class="grow"></div>
      <button class="nav" data-view="settings" type="button"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>ตั้งค่า</button>
    </nav>

    <main class="main" id="main">
      <header class="top">
        <div>
          <h1 id="title">ตรวจบิล</h1>
          <p id="subtitle"></p>
        </div>
        <div class="tools">
          <button class="update-chip" id="updChip" type="button" hidden></button>
          <div class="pill" id="pager">
            <button class="ibtn" id="prevM" type="button" aria-label="เดือนก่อนหน้า"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
            <span id="monthLbl" aria-live="polite">-</span>
            <button class="ibtn" id="nextM" type="button" aria-label="เดือนถัดไป"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
          </div>
          <label class="search" id="searchBox">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <span class="sr">ค้นหาบิล</span>
            <input type="search" id="q" placeholder="ค้นหาเลขบิล ลูกค้า สินค้า" autocomplete="off">
          </label>
          <button class="bell" id="bell" type="button" aria-label="แจ้งเตือนยอดวางบิลที่ยังไม่ได้รับเงิน" aria-expanded="false" aria-controls="pop">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
            <span class="count" id="bellCount" hidden></span>
          </button>
          <button class="btn" id="uploadBtn" type="button">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg>
            อัพโหลดบิล
          </button>
        </div>
      </header>
      <div id="view" aria-live="polite"></div>
    </main>
  </div>
</div>

<aside class="pop" id="pop" aria-label="ยอดวางบิลที่ยังไม่ได้รับเงิน" hidden></aside>
<div id="modalRoot"></div>
<div id="toastRoot" aria-live="polite"></div>
<div class="dropzone-overlay" id="dropOverlay" hidden>วางไฟล์บิล (.xlsx) ที่นี่</div>
<input type="file" id="fileInput" accept=".xlsx" multiple hidden>
<script src="app.js"></script>
</body>
</html>
